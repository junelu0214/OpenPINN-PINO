<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Operator 配置器模型、模式、PDE 和 CSV 角色示意</title>
  <desc id="desc">FNO physics only 二维 Poisson 与独立观测参考数据路径</desc>
  <rect width="960" height="390" fill="#f7f9fc"/>
  <g font-family="sans-serif" fill="#17233b">
    <rect x="35" y="55" width="205" height="115" rx="12" fill="#dbeafe" stroke="#2563a8" stroke-width="3"/>
    <text x="138" y="92" text-anchor="middle" font-size="18" font-weight="700">model × mode</text>
    <text x="138" y="125" text-anchor="middle" font-size="17">FNO × physics_only</text>
    <text x="138" y="151" text-anchor="middle" font-size="13">DeepONet / data / hybrid 亦可选</text>
    <rect x="285" y="55" width="270" height="115" rx="12" fill="#ecfdf5" stroke="#16845b" stroke-width="3"/>
    <text x="420" y="92" text-anchor="middle" font-size="18" font-weight="700">二维 Poisson + BC</text>
    <text x="420" y="128" text-anchor="middle" font-size="23">−uₓₓ − uᵧᵧ = f</text>
    <text x="420" y="153" text-anchor="middle" font-size="13">规则网格 · 四边 Dirichlet</text>
    <rect x="600" y="40" width="320" height="145" rx="12" fill="#fff7ed" stroke="#c76316" stroke-width="3"/>
    <text x="760" y="72" text-anchor="middle" font-size="18" font-weight="700">数据入口互不替代</text>
    <text x="620" y="108" font-size="15">训练观测 CSV</text><text x="785" y="108" font-size="14">data/hybrid 必填</text>
    <text x="620" y="137" font-size="15">physics_only</text><text x="785" y="137" font-size="14">隐藏观测入口</text>
    <text x="620" y="166" font-size="15">训后参考 CSV</text><text x="785" y="166" font-size="14">所有模式可选</text>
    <path d="M75 250h810v90H75z" fill="#eef2ff" stroke="#5b55b5" stroke-width="3"/>
    <text x="480" y="285" text-anchor="middle" font-size="20" font-weight="700">下载 .py → 仓库根目录运行 → metrics / loss / prediction</text>
    <text x="480" y="318" text-anchor="middle" font-size="15">浏览器只生成代码；不训练、不读取本地路径、不上传 CSV</text>
  </g>
  <path d="M245 112h30" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M560 112h30" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M480 190v45" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#64748b"/></marker></defs>
</svg>
