schema_version: 1
experiment:
  name: poisson_1d_baseline
  description: Static 1D Poisson reference baseline; no advanced trick enabled.
  seed: 20260822
  device: cpu
  dtype: float32

problem:
  name: poisson_1d
  kind: static
  domain:
    x: [-1.0, 1.0]
  equation: "-u_xx = pi^2 sin(pi x)"
  exact_solution: "sin(pi x)"
  boundary_conditions:
    type: dirichlet
    value: 0.0

model:
  input_dim: 1
  output_dim: 1
  hidden_layers: [64, 64, 64, 64]
  activation: tanh
  initialization: xavier_uniform
  feature:
    name: identity
  output_transform:
    name: soft

sampling:
  name: uniform
  interior: 512
  boundary: 64

loss:
  formulation: strong
  weights:
    pde: 1.0
    boundary: 1.0

optimizer:
  name: adam
  lr: 0.001

training:
  steps: 5000
  log_every: 100

evaluation:
  points: 501
  metrics: [relative_l2, max_abs_error, residual_rmse, boundary_rmse]

output:
  root: runs/poisson_1d_baseline
  save_config: true
  save_metrics: true
  save_history: true
  save_predictions: true
  save_compute_ledger: true
  save_checkpoint: true
