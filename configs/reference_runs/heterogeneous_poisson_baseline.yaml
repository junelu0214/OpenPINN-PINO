schema_version: 1
experiment:
  name: heterogeneous_poisson_1d_baseline
  description: Two-material static diffusion baseline; no domain decomposition is claimed.
  seed: 20260822
  device: cpu
  dtype: float64

problem:
  name: heterogeneous_poisson_1d
  kind: heterogeneous_static
  domain:
    x: [-1.0, 1.0]
  parameters:
    interface: 0.0
    left_diffusivity: 1.0
    right_diffusivity: 4.0

model:
  input_dim: 1
  output_dim: 1
  hidden_layers: [64, 64, 64, 64]
  activation: tanh
  initialization: xavier_uniform
  feature:
    name: identity
  output_transform:
    name: soft

sampling:
  name: uniform
  interior: 512
  boundary: 64

loss:
  formulation: strong
  weights:
    pde: 1.0
    boundary: 1.0

optimizer:
  name: adam
  lr: 0.001

training:
  steps: 5000
  log_every: 100

evaluation:
  points: 501

output:
  root: runs/heterogeneous_poisson_1d_baseline
  save_checkpoint: true
