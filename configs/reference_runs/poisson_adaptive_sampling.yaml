schema_version: 1
experiment:
  name: poisson_1d_adaptive_sampling
  description: Fixed-seed comparison changing only uniform to residual-adaptive interior sampling.
  seed: 20260826
  device: cpu
  dtype: float32

problem:
  name: poisson_1d
  kind: static
  domain:
    x: [-1.0, 1.0]
  parameters:
    wave_number: 4.0
    amplitude: 1.0
  equation: "-u_xx = (4*pi)^2 sin(4*pi*x)"
  exact_solution: "sin(4*pi*x)"
  boundary_conditions:
    type: dirichlet
    value: 0.0

model:
  name: mlp
  input_dim: 1
  output_dim: 1
  hidden_layers: [64, 64, 64]
  activation: tanh
  initialization: xavier_uniform
  feature:
    name: identity
  output_transform:
    name: soft

sampling:
  name: residual_adaptive
  interior: 256
  boundary: 32
  options:
    candidate_pool: 2048
    power: 1.0
    uniform_mix: 0.1
    epsilon: 0.000000000001

loss:
  formulation: strong
  weights:
    pde: 1.0
    boundary: 1.0

optimizer:
  name: adam
  lr: 0.001

training:
  steps: 1500
  resample_every: 50
  log_every: 250

evaluation:
  points: 501
  metrics: [relative_l2, max_abs_error, residual_rmse, boundary_rmse]

output:
  root: runs/poisson_adaptive_sampling
  save_config: true
  save_metrics: true
  save_history: true
  save_predictions: true
  save_compute_ledger: true
  save_checkpoint: true
